name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain
        run: xcrun --show-sdk-version && xcrun swift --version
      - name: Tests
        run: ./script/ci-test.sh
      - name: Build app bundle
        run: ./script/ci-build.sh
      - name: Verify bundle
        run: |
          plutil -lint dist/TimeLedge.app/Contents/Info.plist
          codesign --verify --deep --strict dist/TimeLedge.app
          test -f dist/TimeLedge.app/Contents/Resources/TimeLedge.icns
          plutil -lint dist/TimeLedge.app/Contents/Resources/PrivacyInfo.xcprivacy
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIconFile' dist/TimeLedge.app/Contents/Info.plist)" = "TimeLedge.icns"
          test "$(/usr/libexec/PlistBuddy -c 'Print :NSPrivacyAccessedAPITypes:0:NSPrivacyAccessedAPIType' dist/TimeLedge.app/Contents/Resources/PrivacyInfo.xcprivacy)" = "NSPrivacyAccessedAPICategoryUserDefaults"
          test "$(/usr/libexec/PlistBuddy -c 'Print :NSPrivacyAccessedAPITypes:0:NSPrivacyAccessedAPITypeReasons:0' dist/TimeLedge.app/Contents/Resources/PrivacyInfo.xcprivacy)" = "CA92.1"
      - name: Package app bundle
        if: github.event_name == 'push'
        run: ditto -c -k --sequesterRsrc --keepParent dist/TimeLedge.app TimeLedge-macOS.zip
      - name: Upload app bundle
        if: github.event_name == 'push'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: TimeLedge-macOS
          path: TimeLedge-macOS.zip
          if-no-files-found: error
          retention-days: 7
