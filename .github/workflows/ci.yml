name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain
        run: xcodebuild -version && xcrun swift --version
      - name: Tests
        run: ./script/ci-test.sh
      - name: Build app bundle
        run: ./script/ci-build.sh
      - name: Verify bundle
        run: |
          plutil -lint dist/TimeLedge.app/Contents/Info.plist
          codesign --verify --deep --strict dist/TimeLedge.app
